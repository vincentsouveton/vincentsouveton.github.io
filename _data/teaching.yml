# Courses on the Teaching page, in this order.
#
# A course can be just a title + status (see Machine Learning), or a table:
#   columns: header labels; the first column holds each row's `label`.
#   rows:    each row has a `label` and a list of `cells` (one per remaining
#            column). A cell is a list of documents {label, file};
#            an empty list [] shows a dash.
#            `span: true` makes a row's single cell span all columns.
#            `note:` adds a small grey remark after the last cell.
#   file:    path inside assets/cours/ (put the PDF there).

