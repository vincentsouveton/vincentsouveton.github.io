<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.url == "/" %}{% assign page_title = site.title %}{% else %}{% assign page_title = page.title | append: " · " | append: site.title %}{% endif %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page.summary | default: page.intro | default: site.description | strip_html | strip_newlines | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page_title | escape }}">
<meta property="og:description" content="{{ page.summary | default: page.intro | default: site.description | strip_html | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/avatar-512.png' | absolute_url }}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="{{ '/assets/img/avatar.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<!-- Apply the saved light/dark choice before the page paints -->
<script>
  try { var t = localStorage.getItem('vs-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% if page.math or page.collection == "notes" %}{% include mathjax.html %}{% endif %}
<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
