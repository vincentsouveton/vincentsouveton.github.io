<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name }}, home">
      <img class="logo" src="{{ '/assets/img/avatar.svg' | relative_url }}" alt="" width="32" height="32">
      <span>{{ site.author.name }}</span>
    </a>
    <nav class="main-nav" aria-label="Main">
      {% for item in site.navigation %}
        {% assign active = false %}
        {% if page.url == item.url %}{% assign active = true %}{% endif %}
        {% if item.url == "/notes.html" and page.collection == "notes" %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch between light and dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
